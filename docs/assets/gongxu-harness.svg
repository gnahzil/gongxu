<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1840" viewBox="0 0 1440 1840" role="img" aria-labelledby="title desc">
  <title id="title">Gongxu 企业级 AI 工程 Harness 全流程</title>
  <desc id="desc">流程从需求输入开始，经过规模与迷雾判断、Sub Spec 拆分、Brainstorming、Planner、人工批准、Executor、Evaluator、人工关键路径验收、分支收尾和过程产物归档。Evaluator 可以将修复清单返回 Executor，契约变化会退回 Brainstorming。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#0c1d36"/>
      <stop offset="1" stop-color="#10192c"/>
    </linearGradient>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64a8ff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#55d6c2" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f2bd59" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="aiCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#193f72"/>
      <stop offset="1" stop-color="#102c53"/>
    </linearGradient>
    <linearGradient id="humanCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a4019"/>
      <stop offset="1" stop-color="#3b2a13"/>
    </linearGradient>
    <linearGradient id="stateCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155052"/>
      <stop offset="1" stop-color="#103739"/>
    </linearGradient>
    <linearGradient id="neutralCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#293750"/>
      <stop offset="1" stop-color="#202a3f"/>
    </linearGradient>
    <linearGradient id="repairCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#592833"/>
      <stop offset="1" stop-color="#3e2028"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f96bc"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f2bd59"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7f8b"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55d6c2"/>
    </marker>
    <style>
      .text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .section { fill: #91a6c7; font-size: 17px; font-weight: 700; letter-spacing: 2px; }
      .card-title { fill: #f7faff; font-size: 21px; font-weight: 700; text-anchor: middle; }
      .card-body { fill: #cbd8ec; font-size: 16px; text-anchor: middle; }
      .card-note { fill: #9fb2cf; font-size: 14px; text-anchor: middle; }
      .edge { fill: none; stroke: #7f96bc; stroke-width: 3; marker-end: url(#arrow); }
      .edge-gold { fill: none; stroke: #f2bd59; stroke-width: 3; marker-end: url(#arrowGold); }
      .edge-red { fill: none; stroke: #ff7f8b; stroke-width: 3; marker-end: url(#arrowRed); }
      .edge-teal { fill: none; stroke: #55d6c2; stroke-width: 3; marker-end: url(#arrowTeal); }
      .edge-dashed { stroke-dasharray: 8 8; }
      .edge-label { fill: #b7c5db; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .human-label { fill: #ffd98a; }
      .repair-label { fill: #ffabb3; }
    </style>
  </defs>

  <rect width="1440" height="1840" rx="28" fill="url(#background)"/>
  <circle cx="1170" cy="120" r="190" fill="#2d77c8" opacity="0.13" filter="url(#softGlow)"/>
  <circle cx="235" cy="1480" r="210" fill="#29a99b" opacity="0.08" filter="url(#softGlow)"/>
  <rect x="56" y="44" width="1328" height="5" rx="2.5" fill="url(#headerGlow)"/>

  <g class="text">
    <text x="72" y="105" fill="#f7faff" font-size="38" font-weight="800">Gongxu Harness</text>
    <text x="72" y="141" fill="#9eb1ce" font-size="18">把大需求拆成可理解、可验证的小闭环</text>
    <text x="1368" y="101" fill="#6f87aa" font-size="14" font-weight="700" text-anchor="end" letter-spacing="1.5">AI-FIRST · HUMAN-OWNED DELIVERY</text>

    <g transform="translate(824 126)">
      <circle cx="0" cy="0" r="6" fill="#66a7ff"/><text x="14" y="5" fill="#aebed5" font-size="14">AI 阶段</text>
      <circle cx="108" cy="0" r="6" fill="#f2bd59"/><text x="122" y="5" fill="#aebed5" font-size="14">人工门禁</text>
      <circle cx="232" cy="0" r="6" fill="#ff7f8b"/><text x="246" y="5" fill="#aebed5" font-size="14">返工</text>
      <circle cx="322" cy="0" r="6" fill="#55d6c2"/><text x="336" y="5" fill="#aebed5" font-size="14">状态与归档</text>
    </g>

    <!-- Section 1 -->
    <rect x="52" y="184" width="1336" height="326" rx="24" fill="#ffffff" opacity="0.025" stroke="#354763"/>
    <text x="78" y="219" class="section">01 · 需求路由</text>

    <!-- Routing edges -->
    <path class="edge" d="M325 320 H395"/>
    <path class="edge" d="M575 285 H665"/>
    <path class="edge" d="M535 260 C650 172 865 172 1005 230"/>
    <path class="edge" d="M575 350 H665"/>
    <path class="edge" d="M485 395 V480 H1115 V455"/>
    <path class="edge" d="M1100 328 V365"/>
    <path class="edge-teal edge-dashed" d="M665 310 H625 V465 H525 V395"/>
    <path class="edge edge-dashed" d="M905 410 H1365 V1625 H1245" opacity="0.48"/>
    <text x="620" y="275" class="edge-label">高迷雾</text>
    <text x="780" y="184" class="edge-label">路线清晰的大需求</text>
    <text x="620" y="374" class="edge-label">极小需求</text>
    <text x="820" y="472" class="edge-label">清晰单需求</text>
    <text x="1126" y="351" class="edge-label">拆分后</text>
    <text x="570" y="453" class="edge-label" fill="#73dccc">收敛后重判</text>
    <text x="1348" y="905" class="edge-label" transform="rotate(90 1348 905)" opacity="0.65">快速通道直接交付</text>

    <!-- Routing cards -->
    <g filter="url(#shadow)">
      <rect x="95" y="260" width="230" height="120" rx="18" fill="url(#neutralCard)" stroke="#7e91b2" stroke-width="2"/>
      <text x="210" y="307" class="card-title">需求输入</text>
      <text x="210" y="338" class="card-body">PRD · 视觉来源</text>
      <text x="210" y="363" class="card-note">代码现状 · 项目规则</text>
    </g>

    <g filter="url(#shadow)">
      <path d="M485 245 L575 320 L485 395 L395 320 Z" fill="url(#neutralCard)" stroke="#7e91b2" stroke-width="2"/>
      <text x="485" y="309" class="card-title">规模与迷雾</text>
      <text x="485" y="338" class="card-body">只选一条入口</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="665" y="230" width="240" height="100" rx="18" fill="url(#aiCard)" stroke="#66a7ff" stroke-width="2"/>
      <text x="785" y="273" class="card-title">Wayfinder</text>
      <text x="785" y="302" class="card-body">收敛路线与关键决策</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="955" y="230" width="290" height="98" rx="18" fill="url(#neutralCard)" stroke="#7e91b2" stroke-width="2"/>
      <text x="1100" y="272" class="card-title">拆分 Sub Spec</text>
      <text x="1100" y="301" class="card-body">按独立业务结果和依赖切分</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="665" y="365" width="240" height="90" rx="18" fill="url(#neutralCard)" stroke="#7e91b2" stroke-width="2"/>
      <text x="785" y="404" class="card-title">快速通道</text>
      <text x="785" y="432" class="card-body">确认 · 修改 · 最窄验证</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="985" y="365" width="260" height="90" rx="18" fill="url(#neutralCard)" stroke="#7e91b2" stroke-width="2"/>
      <text x="1115" y="404" class="card-title">当前 Sub Spec</text>
      <text x="1115" y="432" class="card-body">一次只推进一个业务结果</text>
    </g>

    <!-- Section 2 -->
    <rect x="52" y="536" width="1336" height="386" rx="24" fill="#ffffff" opacity="0.025" stroke="#354763"/>
    <text x="78" y="573" class="section">02 · 澄清、冻结与规划</text>

    <path class="edge" d="M300 675 H355"/>
    <path class="edge-teal" d="M605 675 H660"/>
    <path class="edge" d="M930 675 H985"/>
    <path class="edge" d="M1115 745 V775 H770"/>
    <path class="edge-gold" d="M770 830 H910"/>

    <g filter="url(#shadow)">
      <rect x="90" y="620" width="210" height="110" rx="18" fill="url(#neutralCard)" stroke="#7e91b2" stroke-width="2"/>
      <text x="195" y="665" class="card-title">Sub Spec</text>
      <text x="195" y="695" class="card-body">目标清晰</text>
      <text x="195" y="718" class="card-note">范围可在一轮闭环内交付</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="355" y="600" width="250" height="150" rx="18" fill="url(#aiCard)" stroke="#66a7ff" stroke-width="2"/>
      <text x="480" y="646" class="card-title">Brainstorming</text>
      <text x="480" y="677" class="card-body">Grilling · 逐项消除分支</text>
      <text x="480" y="705" class="card-body">探索代码领土与未知项</text>
      <text x="480" y="731" class="card-note">必要时进入 Domain Modeling</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="660" y="600" width="270" height="150" rx="18" fill="url(#stateCard)" stroke="#55d6c2" stroke-width="2"/>
      <text x="795" y="644" class="card-title">state.md</text>
      <text x="795" y="677" class="card-body">Frozen Contract · Scope</text>
      <text x="795" y="705" class="card-body">Acceptance · revision</text>
      <text x="795" y="731" class="card-note">运行期间的唯一权威状态</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="985" y="600" width="260" height="145" rx="18" fill="url(#aiCard)" stroke="#66a7ff" stroke-width="2"/>
      <text x="1115" y="647" class="card-title">Planner</text>
      <text x="1115" y="679" class="card-body">依赖有序的 Execution Units</text>
      <text x="1115" y="707" class="card-body">契约与验收逐项映射</text>
      <text x="1115" y="731" class="card-note">不写代码，不生成影子状态</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="500" y="780" width="270" height="105" rx="18" fill="url(#stateCard)" stroke="#55d6c2" stroke-width="2"/>
      <text x="635" y="822" class="card-title">manual-e2e.md</text>
      <text x="635" y="851" class="card-body">关键业务路径与验收 Case</text>
      <text x="635" y="875" class="card-note">包含至少一个人工理解路径</text>
    </g>

    <g filter="url(#shadow)">
      <path d="M1000 775 L1090 830 L1000 885 L910 830 Z" fill="url(#humanCard)" stroke="#f2bd59" stroke-width="2"/>
      <text x="1000" y="821" class="card-title">人工批准</text>
      <text x="1000" y="850" class="card-body">允许进入实现</text>
    </g>

    <!-- Section 3 -->
    <rect x="52" y="948" width="1336" height="400" rx="24" fill="#ffffff" opacity="0.025" stroke="#354763"/>
    <text x="78" y="985" class="section">03 · P / G / E 实施与评估循环</text>

    <path class="edge" d="M440 1090 H565"/>
    <path class="edge-gold" d="M855 1090 H985"/>
    <path class="edge-red" d="M710 1170 V1247 C710 1280 650 1295 570 1295 H315 C250 1295 220 1240 220 1170"/>
    <path class="edge-red edge-dashed" d="M710 1010 V932 H95 V675 H355"/>
    <path class="edge-red" d="M1125 1170 V1215"/>
    <path class="edge-gold" d="M1125 1280 C1125 1310 1045 1310 1045 1160"/>

    <text x="438" y="1278" class="edge-label repair-label">NEEDS_WORK · Repair Packet</text>
    <text x="330" y="948" class="edge-label repair-label">契约 / 范围 / 高风险变化 → 重新规划与批准</text>
    <text x="905" y="1077" class="edge-label human-label">PASS</text>
    <text x="1210" y="1205" class="edge-label repair-label">待执行</text>

    <g filter="url(#shadow)">
      <rect x="155" y="1020" width="285" height="150" rx="20" fill="url(#aiCard)" stroke="#66a7ff" stroke-width="2"/>
      <text x="297" y="1067" class="card-title">Executor</text>
      <text x="297" y="1100" class="card-body">只实施获批 Execution Units</text>
      <text x="297" y="1129" class="card-body">返回变更事实与新鲜证据</text>
      <text x="297" y="1154" class="card-note">独立单元可安全并行</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="565" y="1010" width="290" height="160" rx="20" fill="url(#aiCard)" stroke="#66a7ff" stroke-width="2"/>
      <text x="710" y="1058" class="card-title">Evaluator</text>
      <text x="710" y="1091" class="card-body">独立核对 Contract 与 Acceptance</text>
      <text x="710" y="1120" class="card-body">重跑允许的验证</text>
      <text x="710" y="1147" class="card-note">PASS / NEEDS_WORK · 不修代码</text>
    </g>

    <g filter="url(#shadow)">
      <path d="M1125 1005 L1265 1090 L1125 1175 L985 1090 Z" fill="url(#humanCard)" stroke="#f2bd59" stroke-width="2"/>
      <text x="1125" y="1073" class="card-title">人工关键路径</text>
      <text x="1125" y="1102" class="card-body">理解并验证业务逻辑</text>
      <text x="1125" y="1130" class="card-note">通过 · 豁免 · 不适用</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1000" y="1215" width="250" height="70" rx="16" fill="url(#repairCard)" stroke="#ff7f8b" stroke-width="2"/>
      <text x="1125" y="1244" class="card-title" font-size="18">保持 complete</text>
      <text x="1125" y="1270" class="card-note">记录 Resume 与剩余风险</text>
    </g>

    <!-- Section 4 -->
    <rect x="52" y="1374" width="1336" height="354" rx="24" fill="#ffffff" opacity="0.025" stroke="#354763"/>
    <text x="78" y="1411" class="section">04 · 人类拥有交付，过程产物退出活跃上下文</text>

    <path class="edge-gold" d="M1125 1175 V1428 H405"/>
    <path class="edge-teal" d="M425 1505 H565"/>
    <path class="edge" d="M855 1505 H955"/>
    <path class="edge" d="M1130 1445 V1418 C1130 1380 1290 1380 1290 1510 V1582 H1245"/>
    <path class="edge-teal edge-dashed" d="M1130 1565 V1640 H305 V730"/>
    <path class="edge-teal" d="M1130 1565 V1625 H1245"/>
    <path class="edge-teal edge-dashed" d="M785 1555 V1760"/>

    <text x="790" y="1404" class="edge-label human-label">代码验收通过，人工路径已通过或明确处置</text>
    <text x="1112" y="1662" class="edge-label" fill="#73dccc">下一个 Sub Spec</text>
    <text x="1273" y="1608" class="edge-label" fill="#73dccc">全部完成</text>

    <g filter="url(#shadow)">
      <rect x="155" y="1440" width="270" height="130" rx="20" fill="url(#neutralCard)" stroke="#7e91b2" stroke-width="2"/>
      <text x="290" y="1485" class="card-title">分支收尾</text>
      <text x="290" y="1517" class="card-body">Merge · PR · 保留 · 丢弃</text>
      <text x="290" y="1545" class="card-note">每个外部操作都由用户选择</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="565" y="1440" width="290" height="130" rx="20" fill="url(#stateCard)" stroke="#55d6c2" stroke-width="2"/>
      <text x="710" y="1483" class="card-title">压缩并原地归档</text>
      <text x="710" y="1515" class="card-body">保留最终契约与验收结论</text>
      <text x="710" y="1544" class="card-note">不移动目录 · 不自动删除证据</text>
    </g>

    <g filter="url(#shadow)">
      <path d="M1130 1445 L1245 1505 L1130 1565 L1015 1505 Z" fill="url(#neutralCard)" stroke="#7e91b2" stroke-width="2"/>
      <text x="1130" y="1496" class="card-title">还有 Sub Spec？</text>
      <text x="1130" y="1525" class="card-body">逐个小闭环推进</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1245" y="1582" width="120" height="86" rx="20" fill="url(#stateCard)" stroke="#55d6c2" stroke-width="2"/>
      <text x="1305" y="1618" class="card-title" font-size="18">需求交付</text>
      <text x="1305" y="1647" class="card-note">DONE</text>
    </g>

    <!-- State rail -->
    <rect x="135" y="1758" width="1170" height="52" rx="26" fill="#123f40" stroke="#55d6c2" stroke-width="1.5" opacity="0.95"/>
    <circle cx="175" cy="1784" r="8" fill="#55d6c2"/>
    <text x="201" y="1791" fill="#dbfffa" font-size="16" font-weight="700">运行期间：state.md + revision 是唯一活跃状态源</text>
    <text x="1268" y="1791" fill="#88cfc5" font-size="15" text-anchor="end">交付后：压缩 · 归档 · 按治理策略保留</text>
  </g>
</svg>
