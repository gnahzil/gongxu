name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'gnahzil/gongxu' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: npm
    steps:
      # actions/checkout v4, pinned to the commit resolved from the upstream tag
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-node v4, pinned to the commit resolved from the upstream tag
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_tag="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected_tag" >&2
            exit 1
          fi
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run --json
      - name: Publish package with provenance
        run: npm publish --provenance --access public
        env:
          # Bootstrap v0.1.0 with a short-lived granular token. Remove this
          # environment entry after npm Trusted Publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
