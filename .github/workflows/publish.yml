name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'gnahzil/gongxu' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: npm
    steps:
      # actions/checkout v6, pinned to the commit resolved from the upstream tag
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # actions/setup-node v6, pinned to the commit resolved from the upstream tag
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_tag="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected_tag" >&2
            exit 1
          fi
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run --json
      - name: Publish package with provenance
        run: npm publish --provenance --access public
