name: 功能建议
description: 提议通用 Harness、Profile、Extra 或安装器能力
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        请描述要解决的问题，而不只是期望增加的实现。项目私有上下文、内部 URL 和生产数据不得进入公开 Issue。
  - type: textarea
    id: problem
    attributes:
      label: 问题与使用场景
      description: 当前什么工作无法可靠完成，受影响的使用者是谁？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 用可观察结果说明成功标准，不必预先限定实现方案。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 核心 Harness
        - Profile
        - Extra Skill
        - CLI 或安装器
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 可填写当前 workaround、失败路径或不采用其他方案的原因。
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与风险
      description: 是否涉及公共契约、配置 schema、安全边界或迁移？
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议不包含秘密、私有 URL、生产数据或仅适用于单个内部项目的约束。
          required: true
